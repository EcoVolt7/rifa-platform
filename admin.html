<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>EcoVolt - Administración</title>

</head>

<body>

  <h1>Panel administrativo EcoVolt</h1>

  <div id="login">

    <input
      type="email"
      id="email"
      placeholder="Correo"
    >

    <input
      type="password"
      id="password"
      placeholder="Contraseña"
    >

    <button onclick="login()">
      Iniciar sesión
    </button>

  </div>


  <div id="panel" style="display:none;">

  <h2>Panel administrativo EcoVolt</h2>

  <button onclick="cargarCompras()">
    Actualizar compras
  </button>

  <button onclick="logout()">
    Cerrar sesión
  </button>

  <hr>

  <h3>Compras pendientes</h3>

  <div id="comprasPendientes">
    Cargando...
  </div>

</div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL = "https://tveigbcascwgvdtpovif.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_bikgzeAxvmZ8NzYfJUszRQ_Zy9H2AeS";


    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    async function login(){

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if(!email || !password){

        alert("Completa el correo y la contraseña.");

        return;

      }


      const { data, error } =
        await db.auth.signInWithPassword({

          email: email,

          password: password

        });


      if(error){

        alert(
          "No se pudo iniciar sesión: " +
          error.message
        );

        return;

      }


      document.getElementById("login").style.display =
        "none";

      document.getElementById("panel").style.display =
        "block";

    }


    async function logout(){

      await db.auth.signOut();

      document.getElementById("panel").style.display =
        "none";

      document.getElementById("login").style.display =
        "block";

    }
async function cargarCompras(){

  const contenedor =
    document.getElementById("comprasPendientes");

  contenedor.innerHTML =
    "Cargando compras...";


  // ==========================================
  // CARGAR COMPRAS PENDIENTES
  // ==========================================

  const { data, error } =
    await db
      .from("compras")
      .select("*")
      .eq("estado_pago", "pendiente")
      .order("created_at", { ascending: false });


  if(error){

    console.error(error);

    contenedor.innerHTML =
      "Error al cargar las compras.";

    return;

  }


  console.log("COMPRAS:", data);


  if(!data || data.length === 0){

    contenedor.innerHTML =
      "<p>No hay compras pendientes.</p>";

    return;

  }


  // ==========================================
  // OBTENER LOS NÚMEROS DE CADA COMPRA
  // ==========================================

  const compraIds =
    data.map(compra => compra.id);


  const { data: numerosData, error: numerosError } =
    await db
      .from("numeros")
      .select("id, numero, compra_id")
      .in("compra_id", compraIds);


  console.log("NUMEROS DE LAS COMPRAS:", numerosData);


  if(numerosError){

    console.error(
      "Error cargando números:",
      numerosError
    );

    contenedor.innerHTML =
      "Error al cargar los números.";

    return;

  }


  // ==========================================
  // CREAR UNA TARJETA POR CADA COMPRA
  // ==========================================

  data.forEach(compra => {


    // Buscar todos los números pertenecientes
    // a esta compra

    const numerosCompra =
      (numerosData || [])
        .filter(
          numero =>
            Number(numero.compra_id) ===
            Number(compra.id)
        )
        .map(numero => numero.numero)
        .sort((a,b) => a - b);


    const div =
      document.createElement("div");


    div.style.border =
      "1px solid #ccc";

    div.style.padding =
      "15px";

    div.style.marginBottom =
      "10px";

    div.style.borderRadius =
      "8px";


    // ==========================================
    // MOSTRAR TODOS LOS NÚMEROS
    // ==========================================

    const numerosTexto =
      numerosCompra.length > 0
        ? numerosCompra
            .map(numero => "#" + numero)
            .join(", ")
        : "No encontrado";


    div.innerHTML = `

      <strong>Compra #${compra.id}</strong>

      <br><br>

      <strong>Números:</strong>
      ${numerosTexto}

      <br><br>

      <strong>Cantidad:</strong>
      ${compra.cantidad || numerosCompra.length}
      números

      <br><br>

      <strong>Valor:</strong>
      $${Number(compra.valor || 0).toFixed(2)} USD

      <br><br>

      <strong>Cliente:</strong>
      ${compra.nombre_cliente || ""}

      <br>

      <strong>Cédula:</strong>
      ${compra.cedula_cliente || ""}

      <br>

      <strong>Teléfono:</strong>
      ${compra.telefono_cliente || ""}

      <br>

      <strong>Correo:</strong>
      ${compra.correo_cliente || ""}

      <br>

      <strong>Método:</strong>
      ${compra.metodo_pago || ""}

      <br>

      <strong>Estado:</strong>
      ${compra.estado_pago || ""}

      <br>

      <strong>Fecha:</strong>
      ${
        new Date(
          compra.created_at
        ).toLocaleString()
      }

      <br><br>

      <button
        onclick="confirmarPago(${compra.id})">
        Confirmar pago
      </button>

    `;


    contenedor.appendChild(div);

  });

}
    async function confirmarPago(compraId){

  const confirmar =
    confirm(
      "¿Confirmas que el pago de esta compra fue verificado?"
    );

  if(!confirmar){
    return;
  }

  const { data, error } =
    await db.rpc(
      "confirmar_compra",
      {
        p_compra_id: compraId
      }
    );

  if(error){

    console.error(error);

    alert(
      "No se pudo confirmar el pago."
    );

    return;

  }

  if(!data.success){

    alert(data.mensaje);

    await cargarCompras();

    return;

  }

  alert(
    "Pago confirmado correctamente."
  );

  await cargarCompras();

}
  </script>

</body>

</html>
